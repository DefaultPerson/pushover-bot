# Production compose (Coolify) — внешние общие хранилища.
# PostgreSQL: общий инстанс (DB_HOST/DB_PORT/DB_NAME/DB_USER/DB_PASSWORD из env).
# Redis: общий инстанс (REDIS_HOST/REDIS_PORT/REDIS_DB/REDIS_PASSWORD из env).
# Все значения задаются в Coolify → Environment Variables (попадают в .env).
services:
  bot:
    build:
      context: .
      additional_contexts:
        - libs=./libs
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./archive:/app/archive:z
