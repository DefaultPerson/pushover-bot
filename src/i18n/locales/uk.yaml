  /quiet once 23:00-07:00 — лише найближчу таку ніч
  /quiet 8h — на 8 годин від цієї хвилини (можна 30m, 1h30m)
  /quiet off — вимкнути
  Без часового поясу береться останній вказаний, інакше {tz}.
