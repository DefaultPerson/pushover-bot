# Quiet hours, personal alerts, blocks
quiet_usage: |
  <b>Тихие часы</b>: алерты от других приходят без звука и без повторов.
  /quiet 23:00-07:00 Europe/Kyiv — каждый день
  /quiet once 23:00-07:00 — только ближайшую такую ночь
  /quiet 8h — на 8 часов с этой минуты (можно 30m, 1h30m)
  /quiet off — выключить
  Без часового пояса берётся последний указанный, иначе {tz}.
