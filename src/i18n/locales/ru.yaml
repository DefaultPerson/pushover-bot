# Russian locale

# Common
start: |
  Pushover бот доставляет алерты из Telegram на телефон через <a href="https://pushover.net/">Pushover</a>: сирена звучит даже в беззвучном режиме.

  Добавьте бота в группу, и её участники смогут вас разбудить, например, если BTC обновит максимум.

  <b>Как начать</b>
  1. Отправьте сюда /key и настройте Pushover-ключ.
  2. Напишите /enable в каждой группе, из которой хотите получать алерты.

help_private: |
  <b>В личке</b>
  /key — Pushover-ключ
  /list — группы, из которых приходят алерты
  /test_alarm — тестовая сирена себе
  /quiet — тихие часы: алерты от других без звука
  /block · /unblock · /blocks — не получать алерты от человека
  /personalgms on|off — принимать ли личные алерты
  /language — язык

help_group: |
  <b>В группе</b>
  /gm [текст] — разбудить всех
  /pgm [текст] ответом на сообщение или /pgm @username [текст] — разбудить одного
  @{bot} — то же через список людей: сначала имя, потом текст. Работает, даже когда бот не видит /gm
  /enable · /disable — получать алерты из этой группы или перестать
  /test_alarm — тестовая сирена себе
  /id — id ваш, чата и топика
  <b>Админам</b>: /only_admin — /gm только для админов · /confirm_gm — спрашивать перед «разбудить всех» · /language

# Key setup
key_prompt: |
  1. Скачайте приложение Pushover для <a href="https://apps.apple.com/us/app/pushover-notifications/id506088175">iOS</a> или <a href="https://play.google.com/store/apps/details?id=net.superblock.pushover">Android</a>.
  2. Зарегистрируйте аккаунт.
  3. <b>Для Android:</b> Разрешите отправку обычных и критических уведомлений, а также установите громкость в настройках приложения (смотрите фото выше).
  <b>Для iPhone:</b> В приложении Pushover → Настройки → Уведомления включите:
  • Critical Alerts для high-priority
  • Critical Alerts для emergency-priority
  4. Скопируйте свой ключ (PUSHOVER USER KEY) и отправьте его мне.

  Пример ключа: <code>uQiRzpo4DXghDmr9QzzfQu27cmVRsG</code>

  /cancel — отменить настройку ключа.
key_invalid: "Неверный ключ. Pushover User Key должен содержать 30 символов."
key_saved: |
  Новый API ключ успешно настроен.

  Теперь зайдите в желаемые группы с ботом и пропишите в каждой /enable.
key_updated_existing: |
  Ключ обновлён. Ваши подписки в {count} группах по-прежнему активны.
key_validation_failed: "Не удалось проверить ключ. Проверьте правильность и попробуйте снова."
key_cancelled: "Настройка ключа отменена."

