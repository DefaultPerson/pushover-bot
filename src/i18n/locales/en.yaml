# Quiet hours, personal alerts, blocks
quiet_usage: |
  <b>Quiet hours</b>: alerts from others arrive without sound and without repeats.
  /quiet 23:00-07:00 Europe/Kyiv — every day
  /quiet once 23:00-07:00 — only the next such night
  /quiet 8h — for 8 hours from now (also 30m, 1h30m)
  /quiet off — turn off
  Without a timezone, your last one is used, otherwise {tz}.
