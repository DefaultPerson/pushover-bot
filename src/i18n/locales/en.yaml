# English locale

# Common
start: |
  Pushover bot delivers alerts from Telegram to your phone through <a href="https://pushover.net/">Pushover</a>: a siren that sounds even on silent.

  Add the bot to a group, and its members will be able to wake you, for example when BTC hits a new high.

  <b>How to start</b>
  1. Send /key here and set your Pushover key.
  2. Write /enable in each group you want alerts from.

help_private: |
  <b>In private chat</b>
  /key — your Pushover key
  /list — groups you get alerts from
  /test_alarm — test siren to yourself
  /quiet — quiet hours: alerts from others arrive silently
  /block · /unblock · /blocks — stop alerts from a person
  /personalgms on|off — accept personal alerts or not
  /language — language

help_group: |
  <b>In a group</b>
  /gm [text] — wake everyone
  /pgm [text] in reply to a message, or /pgm @username [text] — wake one person
  @{bot} — the same through a list of people: name first, then text. Works even when the bot misses /gm
  /enable · /disable — get alerts from this group or stop
  /test_alarm — test siren to yourself
  /id — ids of you, this chat and topic
  <b>Admins</b>: /only_admin — /gm for admins only · /confirm_gm — ask before waking everyone · /language

# Key setup
key_prompt: |
  1. Download the Pushover app for <a href="https://apps.apple.com/us/app/pushover-notifications/id506088175">iOS</a> or <a href="https://play.google.com/store/apps/details?id=net.superblock.pushover">Android</a>.
  2. Register an account.
  3. <b>For Android:</b> Allow sending regular and critical notifications, and set the volume in the app settings (see the photo above).
  <b>For iPhone:</b> Go to Pushover app → Settings → Notification Settings and enable:
  • Critical Alerts for high-priority
  • Critical Alerts for emergency-priority
  4. Copy your key (PUSHOVER USER KEY) and send it to me.

  Example key: <code>uQiRzpo4DXghDmr9QzzfQu27cmVRsG</code>

  /cancel — cancel key setup.
key_invalid: "Invalid key. Pushover User Key must be 30 characters."
key_saved: |
  New API key successfully configured.

  Now go to your desired groups with the bot and type /enable in each one.
key_updated_existing: |
  Key updated. Your subscriptions in {count} groups are still active.
key_validation_failed: "Could not validate key. Check and try again."
key_cancelled: "Key setup cancelled."

